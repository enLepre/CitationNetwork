<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Explore the references, citing papers and shared foundations around a paper.">
<meta name="theme-color" content="#f5f2ec">
<title>Graph — Citation Network</title>
<script blocking="render" src="assets/navigation.js?v=fluid-11"></script>
<link rel="stylesheet" href="assets/styles.css?v=fluid-11">

</head>
<body data-page="graph">
<div id="app">
<header class="topbar">
<nav id="notebook-menu" class="notebook-menu" aria-label="Citation Network navigation">
<a class="menu-view" data-view="search" href="index.html">Search</a>
<a class="menu-view" data-view="paper" href="paper.html">Paper</a>
<a class="menu-view active" aria-current="page" data-view="graph" href="graph.html">Graph</a>
<a class="menu-view" data-view="list" href="list.html">List</a>
<button id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
          <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
          <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13.1A9 9 0 0 1 10.9 3.1a9 9 0 1 0 10 10Z"/></svg>
        </button>
<button id="share-btn" class="share-btn" aria-label="Share graph" title="Copy a link that reopens this exact graph">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
          </button>
</nav>
</header>
<div class="workspace-content">
<main class="view" id="view-graph" aria-label="Citation graph"><div class="graph-viewport"><div class="stage-overlay" id="loader" hidden="">
        <div class="loader-box">
          <div class="spinner" id="loader-spin"></div>
          <div class="loader-title" id="loader-title">Building citation graph…</div>
          <div class="loader-sub" id="loader-sub">Querying OpenAlex for references and citing work</div>
          <div class="loader-actions" id="loader-actions" hidden="">
            <button class="btn" id="loader-retry">Try again</button>
            <button class="btn" id="loader-sample">Explore sample graph</button>
          </div>
        </div>
      </div><span id="status-counts" hidden aria-live="polite"></span><aside class="paper-stack" id="detail" aria-label="Selected papers" hidden></aside><svg id="graph-canvas" xmlns="http://www.w3.org/2000/svg" aria-label="Connected papers"></svg><div class="controls">
        <div class="group">
          <button id="zoom-in" title="Zoom in">+</button>
          <button id="zoom-out" title="Zoom out">−</button>
        </div>
        <div class="group">
          <button id="zoom-fit" title="Fit to screen">⤢</button>
        </div>
        <details class="graph-options" id="graph-options">
          <summary aria-label="Graph layout and connections" title="Layout & connections"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="var(--bg)"/><circle cx="15" cy="17" r="2.5" fill="var(--bg)"/></svg></summary>
          <div class="graph-options-panel">
            <label class="spacing-label" for="graph-spacing">Spacing <output id="spacing-value">100%</output></label>
            <input id="graph-spacing" type="range" min="80" max="180" step="5" value="100" disabled>
            <label for="graph-links">Connections</label>
            <select id="graph-links"><option value="all">All connections</option><option value="selected">Selected papers</option><option value="shared">Shared connections</option></select>
            <button id="spread-nearby" type="button" disabled>Spread nearby</button>
            <p id="graph-layout-hint">Select a paper to spread its neighbors.</p>
            <p id="graph-layout-status" role="status" aria-live="polite"></p>
          </div>
        </details>
      </div><div class="gtooltip" id="gtooltip"><div class="tt"></div><div class="tm"></div></div></div></main>
</div>
</div>

<div class="toast" id="toast" hidden="">
  <span class="tmsg"></span>
  <input class="tsub" id="toast-url" readonly="" hidden="">
</div>
<script src="assets/layout.js?v=fluid-11" defer></script>
<script src="assets/sample.js?v=fluid-11" defer></script>
<script src="assets/graph.js?v=fluid-11" defer></script>
<script src="assets/openalex.js?v=fluid-11" defer></script>
<script src="assets/tweaks.js?v=fluid-11" defer></script>
<script src="assets/app.js?v=fluid-11" defer></script>
</body>
</html>
