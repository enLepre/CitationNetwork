<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Explore the references, citing papers and shared foundations around a paper.">
<meta name="theme-color" content="#f5f2ec">
<title>Citation Network</title>
<script blocking="render" src="assets/navigation.js?v=bonds-13"></script>
<link rel="stylesheet" href="assets/styles.css?v=bonds-13">

</head>
<body data-page="search">
<div id="app">
<header class="topbar">
<nav id="notebook-menu" class="notebook-menu" aria-label="Citation Network navigation">
<a class="menu-view active" aria-current="page" data-view="search" href="index.html">Search</a>
<a class="menu-view" data-view="paper" href="paper.html">Paper</a>
<a class="menu-view" data-view="graph" href="graph.html">Graph</a>
<a class="menu-view" data-view="list" href="list.html">List</a>
<button id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
          <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
          <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13.1A9 9 0 0 1 10.9 3.1a9 9 0 1 0 10 10Z"/></svg>
        </button>
<button id="share-btn" class="share-btn" aria-label="Share graph" title="Copy a link that reopens this exact graph">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
          </button>
</nav>
</header>
<div class="workspace-content">
<main class="view" id="view-search">
    <div class="search-wrap">
      <h1>Citation Network</h1>
      <p class="lede">A wider landscape of connected papers.</p>

      <div class="bigsearch">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input id="big-input" type="text" aria-label="Search papers" placeholder="Paper title, topic, or DOI…" maxlength="500" autocomplete="off">
        <button id="big-go" type="button" aria-label="Search papers" title="Search papers"><span aria-hidden="true">→</span></button>
      </div>
      <div class="search-options">
        <label>Search <select id="search-mode"><option value="papers">Papers</option><option value="title">Titles only</option><option value="authors">Authors</option></select></label>
        <label>From <input id="search-from" type="number" min="1500" max="2100" placeholder="Any year" aria-label="Published from year"></label>
        <label>To <input id="search-to" type="number" min="1500" max="2100" placeholder="Any year" aria-label="Published through year"></label>
      </div>
      <p class="search-hint" id="search-hint">Find a paper by title, topic, or DOI. Choose Authors to find someone’s publications.</p>
      <button id="author-back" class="search-back" type="button" hidden>← Back to authors</button>
      <p id="search-status" role="status" aria-live="polite"></p>
      <div id="search-results" aria-label="Search results"></div>
      <button id="search-more" class="btn" type="button" hidden>Load more</button>
      <button id="search-retry" class="btn" type="button" hidden>Try again</button>
      <p id="search-source" class="search-hint" hidden>Results from OpenAlex · choose a paper to explore its connections</p>


    </div>
  </main>
</div>
</div>
<div class="toast" id="toast" hidden="">
  <span class="tmsg"></span>
  <input class="tsub" id="toast-url" readonly="" hidden="">
</div>
<script src="assets/openalex.js?v=bonds-13" defer></script>
<script src="assets/tweaks.js?v=bonds-13" defer></script>
<script src="assets/app.js?v=bonds-13" defer></script>
</body>
</html>
