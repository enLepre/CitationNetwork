<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Explore the references, citing papers and shared foundations around a paper.">
<meta name="theme-color" content="#f5f2ec">
<title>Paper — Citation Network</title>
<script blocking="render" src="assets/navigation.js?v=search-14"></script>
<link rel="stylesheet" href="assets/styles.css?v=adaptive-38">

</head>
<body data-page="paper">
<div id="app">
<header class="topbar">
<nav id="notebook-menu" class="notebook-menu" aria-label="Citation Network navigation">
<a class="menu-view" data-view="search" href="index.html">Search</a>
<a class="menu-view active" aria-current="page" data-view="paper" href="paper.html">Paper</a>
<a class="menu-view" data-view="graph" href="graph.html">Graph</a>
<a class="menu-view" data-view="list" href="list.html">List</a>
<button id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
          <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
          <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13.1A9 9 0 0 1 10.9 3.1a9 9 0 1 0 10 10Z"/></svg>
        </button>
<button id="share-btn" class="share-btn" aria-label="Share graph" title="Copy a link that reopens this exact graph">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
          </button>
</nav>
</header>
<div class="workspace-content">
<main class="view" id="view-paper"><div class="paper-content"><div class="filterbar">
        <label class="density">
          <span>Density</span>
          <select id="density">
            <option value="0" selected>Adaptive</option>
            <option value="40">40 citing</option>
            <option value="80">80 citing</option>
            <option value="120">120 citing</option>
          </select>
        </label>
        <button class="chiptoggle" id="toggle-ref" aria-pressed="true"><span class="swatch ref"></span>References</button>
        <button class="chiptoggle" id="toggle-cite" aria-pressed="true"><span class="swatch cite"></span>Citing</button>
        <button class="chiptoggle" id="toggle-linked" aria-pressed="true"><span class="swatch linked"></span>Co-cited</button>
      </div><div class="statusbar">
        <span class="k"><span class="swatch seed"></span>Seed</span>
        <span class="k"><span class="swatch ref"></span>References</span>
        <span class="k"><span class="swatch cite"></span>Citing</span>
        <span class="k"><span class="swatch linked"></span>Co-cited</span>
        <span class="div"></span>
        <span id="status-counts">drag · scroll to zoom · click a node</span>
        <span class="div"></span>
        <span class="src">OpenAlex</span>
      </div><div class="stage-overlay" id="loader" hidden="">
        <div class="loader-box">
          <div class="spinner" id="loader-spin"></div>
          <div class="loader-title" id="loader-title">Building citation graph…</div>
          <div class="loader-sub" id="loader-sub">Querying OpenAlex for references and citing work</div>
          <div class="loader-actions" id="loader-actions" hidden="">
            <button class="btn" id="loader-retry">Try again</button>
          </div>
        </div>
      </div><aside class="detail closed" id="detail" aria-label="Paper summary">
      <div class="detail-head">
        <span class="role seed">Seed paper</span>
        <button class="x" id="detail-close" title="Close">✕</button>
      </div>
      <div class="detail-body">
        <h1 id="d-title"></h1>
        <div class="authors" id="d-authors"></div>
        <div class="venue" id="d-venue"></div>
        <a id="d-link" class="d-link" href="#" target="_blank" rel="noopener noreferrer">
          View at publisher
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </a>
        <div class="stats">
          <div class="stat"><div class="v" id="d-cites">—</div><div class="l">Citations</div></div>
          <div class="stat"><div class="v" id="d-refs">—</div><div class="l">References</div></div>
          <div class="stat"><div class="v" id="d-citedhere">—</div><div class="l">Cited here</div></div>
        </div>
        <span class="lbl">Abstract</span>
        <p class="abstract" id="d-abstract"></p>
        <div id="d-conns" class="connlist"></div>
      </div>
      <div class="detail-foot">
        <button class="btn" id="d-recenter">Re-center graph</button>
      </div>
    </aside></div></main>
</div>
</div>

<div class="toast" id="toast" hidden="">
  <span class="tmsg"></span>
  <input class="tsub" id="toast-url" readonly="" hidden="">
</div>
<script src="assets/openalex.js?v=adaptive-38" defer></script>
<script src="assets/tweaks.js?v=seed-33" defer></script>
<script src="assets/app.js?v=adaptive-38" defer></script>
</body>
</html>
